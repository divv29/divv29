<svg viewBox="0 0 1400 90" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0A17"/>
      <stop offset="50%" stop-color="#1E1839"/>
      <stop offset="100%" stop-color="#0B0A17"/>
    </linearGradient>
    <linearGradient id="footLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0A17" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#0B0A17" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="90" fill="url(#footBg)"/>

  <line x1="0" y1="18" x2="1400" y2="18" stroke="url(#footLine)" stroke-width="1.5"/>

  <g fill="#7C3AED">
    <circle cx="660" cy="18" r="3">
      <animate attributeName="cy" values="18;12;18" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="18" r="3">
      <animate attributeName="cy" values="18;12;18" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="18" r="3">
      <animate attributeName="cy" values="18;12;18" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="700" y="60" text-anchor="middle" font-family="Fira Code, monospace" font-size="14" fill="#8A7BC8" opacity="0.85">
    Thanks for stopping by — let's build something together.
  </text>
</svg>
