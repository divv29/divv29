<svg viewBox="0 0 1400 400" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0A17"/>
      <stop offset="45%" stop-color="#181234"/>
      <stop offset="100%" stop-color="#241B4E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="1400" height="400" fill="url(#bg)"/>

  <!-- ambient glow, drifting -->
  <circle cx="1150" cy="90" r="220" fill="url(#glow)">
    <animate attributeName="cx" values="1150;1080;1150" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="r" values="220;260;220" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="340" r="170" fill="url(#glow)" opacity="0.5">
    <animate attributeName="cy" values="340;300;340" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- constellation network representing the tech stack -->
  <g stroke="#7C3AED" stroke-width="1" opacity="0.55">
    <line x1="80" y1="90" x2="230" y2="60">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="230" y1="60" x2="360" y2="120">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="90" x2="150" y2="200">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="200" x2="360" y2="120">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1240" y1="260" x2="1330" y2="330">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="1240" y1="260" x2="1170" y2="340">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="6.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1170" y1="340" x2="1330" y2="330">
      <animate attributeName="opacity" values="0.3;0.55;0.3" dur="5.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <g fill="url(#nodeGrad)">
    <circle cx="80" cy="90" r="4" filter="url(#softBlur)"><animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="60" r="3.5" filter="url(#softBlur)"><animate attributeName="r" values="2.5;4.5;2.5" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="120" r="3" filter="url(#softBlur)"><animate attributeName="r" values="2;4;2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="200" r="3" filter="url(#softBlur)"><animate attributeName="r" values="2;4;2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1240" cy="260" r="4" filter="url(#softBlur)"><animate attributeName="r" values="3;5;3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1330" cy="330" r="3" filter="url(#softBlur)"><animate attributeName="r" values="2;4;2" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1170" cy="340" r="3.5" filter="url(#softBlur)"><animate attributeName="r" values="2.5;4.5;2.5" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating code glyphs -->
  <g fill="#A78BFA" opacity="0.28" font-family="Fira Code, monospace" font-size="20">
    <text x="60" y="330">&lt;/&gt;</text>
    <text x="1300" y="70">{ }</text>
    <text x="1250" y="150">01</text>
    <text x="110" y="140">λ</text>
  </g>

  <!-- name + tagline -->
  <text x="700" y="185" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#textGrad)">
    Divyansh Tiwari
  </text>
  <text x="700" y="230" text-anchor="middle" font-family="Fira Code, monospace" font-size="18" fill="#C4B5FD" opacity="0.9">
    Full-Stack Developer · AI/ML Explorer · Cybersecurity
  </text>

  <!-- animated underline accent -->
  <rect x="600" y="252" width="200" height="3" rx="1.5" fill="url(#nodeGrad)">
    <animate attributeName="width" values="0;200;200;0" keyTimes="0;0.3;0.7;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="700;600;600;700" keyTimes="0;0.3;0.7;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- location chip -->
  <g transform="translate(605,285)">
    <rect width="190" height="34" rx="17" fill="#1E1839" stroke="#7C3AED" stroke-width="1" opacity="0.9"/>
    <text x="95" y="22" text-anchor="middle" font-family="Fira Code, monospace" font-size="14" fill="#E9D5FF">Pune, India 🇮🇳</text>
  </g>

  <!-- bottom wave -->
  <path d="M0,400 L0,340 Q350,290 700,340 T1400,340 L1400,400 Z" fill="#000000" opacity="0.18"/>
</svg>
