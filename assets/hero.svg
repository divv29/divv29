<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Divyansh Tiwari - Full-Stack Developer and AI/ML Explorer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F0C29"/>
      <stop offset="0.55" stop-color="#18123F"/>
      <stop offset="1" stop-color="#2A2560"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.8" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1850" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0F0C29" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <style>
    .float  { animation: float 7s ease-in-out infinite; }
    .float2 { animation: float 9s ease-in-out infinite reverse; }
    .pulse  { animation: pulse 4s ease-in-out infinite; }
    .rise   { animation: rise 1.2s ease-out both; }
    .rise2  { animation: rise 1.2s ease-out 0.3s both; }
    .rise3  { animation: rise 1.2s ease-out 0.6s both; }
    .grow   { transform-origin: 500px 214px; animation: grow 1.4s ease-out 0.5s both; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes rise  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>

  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#glowA)" class="pulse"/>
  <rect width="1000" height="280" fill="url(#glowB)"/>

  <!-- constellation top-left -->
  <g class="float" stroke="#6D5BD0" stroke-opacity="0.45" stroke-width="1" fill="none">
    <polyline points="55,58 165,36 260,80 108,136 55,58"/>
  </g>
  <g class="float" fill="#8B7BEA">
    <circle cx="55" cy="58" r="4"/><circle cx="165" cy="36" r="4"/>
    <circle cx="260" cy="80" r="3.5"/><circle cx="108" cy="136" r="3.5"/>
  </g>

  <!-- constellation bottom-right -->
  <g class="float2" stroke="#6D5BD0" stroke-opacity="0.45" stroke-width="1" fill="none">
    <polyline points="845,238 895,180 960,232 845,238"/>
  </g>
  <g class="float2" fill="#8B7BEA">
    <circle cx="845" cy="238" r="4"/><circle cx="895" cy="180" r="4.5"/><circle cx="960" cy="232" r="3.5"/>
  </g>

  <!-- code glyphs -->
  <g font-family="'Courier New', Courier, monospace" fill="#7F6FE0" fill-opacity="0.45" font-size="22">
    <text x="940" y="42">{ }</text>
    <text x="910" y="100" font-size="18">01</text>
    <text x="38" y="250">&lt;/&gt;</text>
    <text x="84" y="104" font-size="20">&#955;</text>
    <text x="170" y="236" font-size="16">=&gt;</text>
    <text x="760" y="60" font-size="16">&amp;&amp;</text>
  </g>

  <!-- bottom wave -->
  <path d="M0 232 C 200 205, 380 255, 560 238 S 860 205, 1000 232 L1000 280 L0 280 Z" fill="url(#wave)" opacity="0.85"/>

  <!-- name -->
  <text x="500" y="142" text-anchor="middle" class="rise"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="60"
        fill="url(#name)" letter-spacing="1">Divyansh Tiwari</text>

  <!-- subtitle -->
  <text x="500" y="186" text-anchor="middle" class="rise2"
        font-family="'Courier New', Courier, monospace" font-weight="700" font-size="20"
        fill="#C4B5FD" letter-spacing="1.5">Full-Stack Developer  &#183;  AI/ML Explorer</text>

  <!-- underline -->
  <rect x="440" y="212" width="120" height="4" rx="2" fill="url(#bar)" class="grow"/>
</svg>
